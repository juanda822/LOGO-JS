name: Build optimized original logos
on:
  push:
    branches: [optimize-original-logo-webp]
    paths:
      - '.github/workflows/optimize-logo.yml'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate optimized WebP assets and update HTML
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          original = Image.open("images/logo.png").convert("RGBA")
          for size, name in [(512, "logo-hero.webp"), (160, "logo-footer.webp")]:
              im = original.copy()
              im.thumbnail((size,size), Image.Resampling.LANCZOS)
              im.save(Path("images") / name, "WEBP", quality=82, method=4)
          html_file = Path("index.html")
          text = html_file.read_text(encoding="utf-8")
          assert text.count('src="images/logo.png"') == 2
          text = text.replace('src="images/logo.png"', 'src="images/logo-hero.webp"', 1)
          text = text.replace('src="images/logo.png"', 'src="images/logo-footer.webp"', 1)
          html_file.write_text(text,encoding="utf-8")
          PY
      - name: Commit optimized images and HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/logo-hero.webp images/logo-footer.webp index.html
          git commit -m "Use optimized WebP logos for hero and footer"
          git push
